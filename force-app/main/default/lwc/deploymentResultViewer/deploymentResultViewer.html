<template>
    <lightning-card title="Deployment Result" icon-name="standard:metrics">
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>
        <template if:true={hasError}>
            <div class="slds-p-around_medium">
                <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                <span class="slds-m-left_x-small">{errorMessage}</span>
            </div>
        </template>
        <template if:true={hasResult}>
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                        <div class="summary-card">
                            <p class="summary-label">Status</p>
                            <span class={statusBadgeClass}>{deploymentStatus}</span>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                        <div class="summary-card">
                            <p class="summary-label">Components Deployed</p>
                            <p class="summary-value">{numberComponentsDeployed} / {numberComponentsTotal}</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                        <div class="summary-card">
                            <p class="summary-label">Component Errors</p>
                            <p class={errorCountClass}>{numberComponentErrors}</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                        <div class="summary-card">
                            <p class="summary-label">Completed</p>
                            <p class="summary-value">{completedDate}</p>
                        </div>
                    </div>
                </div>
                <template if:true={hasComponents}>
                    <h3 class="slds-text-heading_small slds-m-bottom_x-small">Component Details</h3>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate">Component Name</div></th>
                                <th scope="col"><div class="slds-truncate">Type</div></th>
                                <th scope="col"><div class="slds-truncate">State</div></th>
                                <th scope="col"><div class="slds-truncate">Status</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={componentRows} for:item="row">
                                <tr key={row.fullName}>
                                    <td><div class="slds-truncate" title={row.fullName}>{row.fullName}</div></td>
                                    <td><div class="slds-truncate">{row.componentType}</div></td>
                                    <td><div class="slds-truncate">{row.state}</div></td>
                                    <td>
                                        <lightning-icon
                                            icon-name={row.statusIcon}
                                            variant={row.statusVariant}
                                            size="x-small"
                                            class="slds-m-right_xx-small">
                                        </lightning-icon>
                                        {row.statusLabel}
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <div class="slds-m-top_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_x-small">Test Results</h3>
                    <div class="slds-grid slds-gutters">
                        <div class="slds-col">
                            <p><strong>Tests Run:</strong> {numTestsRun}</p>
                        </div>
                        <div class="slds-col">
                            <p><strong>Failures:</strong> {numFailures}</p>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        <template if:false={hasResult}>
            <template if:false={isLoading}>
                <template if:false={hasError}>
                    <div class="slds-p-around_medium slds-text-color_weak">
                        No deployment result file found for this record.
                    </div>
                </template>
            </template>
        </template>
    </lightning-card>
</template>
